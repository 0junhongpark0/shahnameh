<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 샤나메 한 구절 · 결과 카드</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#eef3f7;color:#0b2a4a}main{max-width:530px;margin:0 auto;padding:18px 18px 40px}.header{background:#0b2a4a;color:#fff;border-radius:13px;padding:18px 20px;margin-bottom:15px}.header h1{font-size:21px;margin:5px 0}.eyebrow{font-size:12px;letter-spacing:.08em;color:#c8dbe9}p{line-height:1.7}#preview{width:100%;border:1px solid #d6e0e9;box-shadow:0 6px 24px #132f4522;border-radius:6px;display:none}#status{font-size:15px}button{font:inherit;width:100%;padding:14px 12px;margin-top:10px;border:0;border-radius:9px;background:#0b2a4a;color:white;font-weight:700;cursor:pointer}.secondary{background:#e2eaf0;color:#0b2a4a}small{display:block;color:#597286;line-height:1.7;margin-top:14px}#shareFile{display:none}
</style></head><body><main><div class="header"><div class="eyebrow">SHAHNAMEH · PERSIAN TYPING</div><h1>오늘의 샤나메 한 구절</h1><div>체험 결과 카드</div></div><p id="status" role="status">이미지를 준비하는 중입니다.</p><img id="preview" alt="완성한 페르시아어 구절과 타자 기록이 있는 결과 카드"><button id="download" hidden>PNG 이미지 다운로드 · 1080×1350</button><button id="shareFile">사진 앱에 저장 / 공유</button><small>iPhone에서는 공유 메뉴의 '이미지 저장'을 이용할 수 있습니다. 지원하지 않는 경우 이미지를 길게 눌러 저장하거나 다운로드 버튼을 이용하세요. 결과 정보는 QR 링크로 전달되며, 서버에 별도로 저장되지 않습니다.</small></main>
<script>
'use strict';
const STORY_DATA = [
    {
        id: 'rs-174',
        c: '로스탐과 소흐랍',
        p: 'خنجر رستم برق زد',
        k: '로스탐의 단검이 번뜩였다.'
    },
    {
        id: 'rs-175',
        c: '로스탐과 소흐랍',
        p: 'رستم به پهلوی سهراب خنجر زد',
        k: '로스탐은 소흐랍의 옆구리에 단검을 찔러 넣었다.'
    },
    {
        id: 'rs-185',
        c: '로스탐과 소흐랍',
        p: 'اگه پدرم بفهمه، تو رو زنده نمی ذاره!',
        k: '"내 아버지가 이 사실을 알면 널 살려두지 않을 거다!"'
    },
    {
        id: 'rs-187',
        c: '로스탐과 소흐랍',
        p: 'کسی هم برد سوی رستم نشان',
        k: '"누군가는 로스탐에게 이 일을 전하겠지."'
    },
    {
        id: 'rs-188',
        c: '로스탐과 소흐랍',
        p: 'چو بشنید رستم سرش خیره گشت',
        k: '그 말을 들은 로스탐은 정신이 아득해졌다.'
    },
    {
        id: 'rs-194',
        c: '로스탐과 소흐랍',
        p: 'رستم منم!',
        k: '"내가 바로 로스탐이다!"'
    },
    {
        id: 'rs-195',
        c: '로스탐과 소흐랍',
        p: 'سهراب گفت، پدر تویی؟',
        k: '소흐랍이 물었다. "아버지... 당신이 제 아버지인가요?"'
    },
    {
        id: 'rs-199',
        c: '로스탐과 소흐랍',
        p: 'به بازوم بر مهره خود نگر',
        k: '"제 팔에 있는, 당신이 남겨 주신 징표를 보십시오."'
    },
    {
        id: 'rs-201',
        c: '로스탐과 소흐랍',
        p: 'رستم فریاد زد، سهرابم! با دست خودم کشتمت!',
        k: '로스탐이 울부짖었다. "소흐랍아! 내가 내 손으로 너를 죽였구나!"'
    },
    {
        id: 'rs-214',
        c: '로스탐과 소흐랍',
        p: 'رستم پیکر سهراب را در آغوش گرفت',
        k: '로스탐은 소흐랍의 시신을 품에 끌어안았다.'
    }
];



// 신규 입문 문구: 기존 STORY_DATA와 입력 로직은 유지하고 문구 목록만 전환합니다.
// 각 원문 한 행은 『샤나메』에서 그대로 발췌한 문장입니다.
const INTRO_LESSONS = {
    greeting: {label:'안녕 · درود', entries:[
        {id:'intro-greeting-word',c:'일상 페르시아어',p:'درود',k:'안녕 · 인사와 축원'},
        {id:'intro-greeting-phrase',c:'『샤나메』',p:'درود فریدون',k:'페레이둔의 인사'},
        {id:'intro-greeting-line',c:'『샤나메』',p:'درود فریدون فرخ دهم',k:'복된 페레이둔의 인사를 전합니다.'}
    ]},
    thanks: {label:'고마워 · سپاس', entries:[
        {id:'intro-thanks-word',c:'일상 페르시아어',p:'سپاس',k:'고마워 · 감사'},
        {id:'intro-thanks-phrase',c:'『샤나메』',p:'به بخشش سپاس',k:'베푼 은혜에 감사'},
        {id:'intro-thanks-line',c:'『샤나메』',p:'ز بهرام دارم به بخشش سپاس',k:'바흐람이 베푼 은혜에 감사드립니다.'}
    ]},
    friend: {label:'친구 · دوست', entries:[
        {id:'intro-friend-word',c:'일상 페르시아어',p:'دوست',k:'친구'},
        {id:'intro-friend-phrase',c:'『샤나메』',p:'مهربان دوست',k:'다정한 친구'},
        {id:'intro-friend-line',c:'『샤나메』',p:'به شهرم یکی مهربان دوست بود',k:'내가 사는 고장에는 다정한 친구가 있었습니다.'}
    ]}
};

const ALL_CARD_DATA=[...STORY_DATA,...Object.values(INTRO_LESSONS).flatMap(l=>l.entries)];
const fmtMs=ms=>{const sec=ms>0?Math.max(1,Math.floor(ms/1000)):0;return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;};
function b64urlDecode(value){const binary=atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0))));}
function sanitizeSnapshot(s){if(!s||s.v!==1||typeof s.id!=='string'||s.id.length>128)throw Error('지원되지 않는 공유 데이터입니다.');for(const key of ['n','g','t','c','s','d'])if(!Number.isSafeInteger(s[key])||s[key]<0||s[key]>1e8)throw Error('공유 기록이 올바르지 않습니다.');if(s.n<1||s.g>s.t||s.d<s.n||!Number.isFinite(Date.parse(s.at)))throw Error('공유 기록의 값이 잘못되었습니다.');return s;}
function cardStats(s){const ms=s.s*100;return {count:s.n,acc:s.t?Math.floor(s.g/s.t*100):100,cpm:ms>0?Math.floor(s.c/(Math.max(ms,1000)/60000)):0,ms};}

function drawShareCard(canvas,s){
    sanitizeSnapshot(s);
    const p=ALL_CARD_DATA.find(x=>x.id===s.id);
    if(!p)throw Error('공유 데이터에 해당하는 문구가 없습니다.');
    const x=cardStats(s);
    canvas.width=1080;canvas.height=1350;
    const g=canvas.getContext('2d');
    g.fillStyle='#f8fafc';g.fillRect(0,0,1080,1350);
    g.strokeStyle='#cfdee8';g.lineWidth=3;g.strokeRect(35,35,1010,1280);
    g.textAlign='center';g.direction='ltr';
    g.fillStyle='#577590';g.font='bold 22px Arial, sans-serif';g.fillText('SHAHNAMEH · PERSIAN TYPING',540,124);
    g.fillStyle='#0b2a4a';g.font='bold 49px "Malgun Gothic",sans-serif';g.fillText('오늘의 샤나메 한 구절',540,207);
    g.fillStyle='#1f6794';g.fillRect(452,248,176,4);
    const isIntro=s.id.startsWith('intro-');
    g.fillStyle='#40749a';g.font='bold 25px "Malgun Gothic",sans-serif';
    g.fillText(isIntro?'일상 페르시아어에서 발견한 고전의 한 줄':'로스탐과 소흐랍 · 내가 입력한 구절',540,334);
    const persian=p.p;
    const faFont='"Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif';
    const koFont='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    function wrapped(text,width,font,maxLines){
        const words=text.trim().split(/\s+/),lines=[];let line='';
        g.font=font;
        for(const word of words){const test=line?line+' '+word:word;
          if(g.measureText(test).width>width && line){lines.push(line);line=word;}
          else{line=test;}
        }
        if(line)lines.push(line);
        return lines.slice(0,maxLines);
    }
    // Right-to-left rendering is handled by Canvas itself, not reversed manually.
    let fontSize=70,faLines=[];
    do{g.font=`bold ${fontSize}px ${faFont}`;faLines=wrapped(persian,910,g.font,4);if(faLines.every(t=>g.measureText(t).width<=910)&&faLines.length<=3)break;fontSize-=2;}while(fontSize>34);
    g.fillStyle='#173b4a';g.direction='rtl';g.textAlign='center';g.font=`bold ${fontSize}px ${faFont}`;
    const lineHeight=Math.round(fontSize*1.55),poemTop=480-(faLines.length-1)*lineHeight/2;
    faLines.forEach((t,i)=>g.fillText(t,540,poemTop+i*lineHeight));
    g.direction='ltr';g.fillStyle='#cfdee8';g.fillRect(100,705,880,2);
    let koSize=36,koLines=[];
    do{g.font=`${koSize}px ${koFont}`;koLines=wrapped(p.k||' ',850,g.font,3);if(koLines.every(t=>g.measureText(t).width<=850)&&koLines.length<=2)break;koSize-=1;}while(koSize>23);
    g.textAlign='center';g.fillStyle='#344c61';g.font=`${koSize}px ${koFont}`;
    koLines.forEach((t,i)=>g.fillText(t,540,775+i*51));
    g.fillStyle='#0b2a4a';g.font=`bold 27px ${koFont}`;g.fillText('오늘의 타이핑 기록',150,953);
    const metrics=[['완료 구절',`${x.count}개`],['평균 타수',`${x.cpm} 타/분`],['정확도',`${x.acc}%`],['연습 시간',fmtMs(x.ms)]];
    metrics.forEach(([label,value],i)=>{
      const col=i%2,row=Math.floor(i/2),rx=95+col*452,ry=978+row*104;
      g.fillStyle='#e9f1f7';g.fillRect(rx,ry,430,88);
      g.textAlign='left';g.fillStyle='#58728a';g.font=`20px ${koFont}`;g.fillText(label,rx+21,ry+30);
      g.fillStyle='#0b2a4a';g.font=`bold 29px ${koFont}`;g.fillText(value,rx+21,ry+69);
    });
    g.fillStyle='#cfdee8';g.fillRect(97,1202,886,2);
    g.textAlign='center';g.fillStyle='#466780';g.font=`22px ${koFont}`;
    g.fillText('낯선 글자, 익숙한 말 · 샤나메 타이핑 체험',540,1255);
    g.font=`17px ${koFont}`;
    g.fillText(new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Seoul'}).format(new Date(s.at)),540,1290);
}

let blob=null,url=null;
function download(){if(!url)return;const a=document.createElement('a');a.href=url;a.download='오늘의 샤나메 한 구절.png';document.body.appendChild(a);a.click();a.remove();}
async function openNative(){if(!blob)return;try{const file=new File([blob],'오늘의 샤나메 한 구절.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'오늘의 샤나메 한 구절'});else download();}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent='공유 메뉴를 열지 못했습니다. 다운로드 버튼을 이용하세요.';}}
(async function(){try{if(!location.hash.startsWith('#share='))throw Error('결과 데이터가 없습니다. QR을 다시 스캔하세요.');const token=location.hash.slice(7);if(token.length>1800)throw Error('결과 데이터가 너무 깁니다.');const s=sanitizeSnapshot(b64urlDecode(token));if(!ALL_CARD_DATA.some(p=>p.id===s.id))throw Error('지원하지 않는 구절입니다.');const canvas=document.createElement('canvas');drawShareCard(canvas,s);blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('이미지 생성 실패');url=URL.createObjectURL(blob);document.getElementById('preview').src=url;document.getElementById('preview').style.display='block';document.getElementById('download').hidden=false;document.getElementById('download').onclick=download;document.getElementById('shareFile').onclick=openNative;const file=new File([blob],'오늘의 샤나메 한 구절.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))document.getElementById('shareFile').style.display='block';document.getElementById('status').textContent='완성한 이미지를 휴대폰에 저장할 수 있습니다.';}catch(e){document.getElementById('status').textContent='결과 페이지 오류: '+e.message;}})();
</script></body></html>
