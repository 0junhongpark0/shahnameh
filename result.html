<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낯선 글자, 익숙한 말 · 기념 카드</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#eef3f7;color:#0b2a4a}main{max-width:530px;margin:0 auto;padding:18px 18px 40px}.header{background:#0b2a4a;color:#fff;border-radius:13px;padding:18px 20px;margin-bottom:15px}.header h1{font-size:21px;margin:5px 0}.eyebrow{font-size:12px;letter-spacing:.08em;color:#c8dbe9}p{line-height:1.7}#preview{width:100%;border:1px solid #d6e0e9;box-shadow:0 6px 24px #132f4522;border-radius:6px;display:none}#status{font-size:15px}button{font:inherit;width:100%;padding:14px 12px;margin-top:10px;border:0;border-radius:9px;background:#0b2a4a;color:white;font-weight:700;cursor:pointer}.secondary{background:#e2eaf0;color:#0b2a4a}small{display:block;color:#597286;line-height:1.7;margin-top:14px}#shareFile{display:none}
</style></head><body><main><div class="header"><div class="eyebrow">FERDOWSI · SHAHNAMEH</div><h1>낯선 글자, 익숙한 말</h1><div>기념 카드</div></div><p id="status" role="status">이미지를 준비하는 중입니다.</p><img id="preview" alt="직접 쓴 페르시아어와 『샤나메』의 구절을 담은 기념 카드"><button id="download" hidden>이미지 저장</button><button id="shareFile">사진 앱에 저장 / 공유</button><small>iPhone에서는 공유 메뉴의 '이미지 저장'을 이용할 수 있습니다. 지원하지 않는 경우 이미지를 길게 눌러 저장하거나 다운로드 버튼을 이용하세요.</small></main>
<script>
'use strict';
const STORY_DATA = [
    {
        id: 'rs-174',
        c: '로스탐과 소흐랍',
        p: 'خنجر رستم برق زد',
        k: '로스탐의 단검이 번뜩였다.'
    },
    {
        id: 'rs-175',
        c: '로스탐과 소흐랍',
        p: 'رستم به پهلوی سهراب خنجر زد',
        k: '로스탐은 소흐랍의 옆구리에 단검을 찔러 넣었다.'
    },
    {
        id: 'rs-185',
        c: '로스탐과 소흐랍',
        p: 'اگه پدرم بفهمه، تو رو زنده نمی ذاره!',
        k: '"내 아버지가 이 사실을 알면 널 살려두지 않을 거다!"'
    },
    {
        id: 'rs-187',
        c: '로스탐과 소흐랍',
        p: 'کسی هم برد سوی رستم نشان',
        k: '"누군가는 로스탐에게 이 일을 전하겠지."'
    },
    {
        id: 'rs-188',
        c: '로스탐과 소흐랍',
        p: 'چو بشنید رستم سرش خیره گشت',
        k: '그 말을 들은 로스탐은 정신이 아득해졌다.'
    },
    {
        id: 'rs-194',
        c: '로스탐과 소흐랍',
        p: 'رستم منم!',
        k: '"내가 바로 로스탐이다!"'
    },
    {
        id: 'rs-195',
        c: '로스탐과 소흐랍',
        p: 'سهراب گفت، پدر تویی؟',
        k: '소흐랍이 물었다. "아버지... 당신이 제 아버지인가요?"'
    },
    {
        id: 'rs-199',
        c: '로스탐과 소흐랍',
        p: 'به بازوم بر مهره خود نگر',
        k: '"제 팔에 있는, 당신이 남겨 주신 징표를 보십시오."'
    },
    {
        id: 'rs-201',
        c: '로스탐과 소흐랍',
        p: 'رستم فریاد زد، سهرابم! با دست خودم کشتمت!',
        k: '로스탐이 울부짖었다. "소흐랍아! 내가 내 손으로 너를 죽였구나!"'
    },
    {
        id: 'rs-214',
        c: '로스탐과 소흐랍',
        p: 'رستم پیکر سهراب را در آغوش گرفت',
        k: '로스탐은 소흐랍의 시신을 품에 끌어안았다.'
    }
];



// 신규 입문 문구: 기존 STORY_DATA와 입력 로직은 유지하고 문구 목록만 전환합니다.
// 입문 문구의 마지막 한 행은 『샤나메』 본문과 대조했습니다.
// 로스탐과 소흐랍 STORY_DATA에는 원문과 현대 페르시아어 재구성 문장이 혼재합니다.
const INTRO_LESSONS = {
    greeting: {label:'안녕 · درود', entries:[
        {id:'intro-greeting-word',c:'일상 페르시아어',p:'درود',k:'안녕 · 인사와 축원'},
        {id:'intro-greeting-phrase',c:'『샤나메』',p:'درود فریدون',k:'페레이둔의 인사'},
        {id:'intro-greeting-line',c:'『샤나메』',p:'درود فریدون فرخ دهم',k:'복된 페레이둔의 인사를 전합니다.'}
    ]},
    thanks: {label:'고마워 · سپاس', entries:[
        {id:'intro-thanks-word',c:'일상 페르시아어',p:'سپاس',k:'고마워 · 감사'},
        {id:'intro-thanks-phrase',c:'『샤나메』',p:'به بخشش سپاس',k:'베푼 은혜에 감사'},
        {id:'intro-thanks-line',c:'『샤나메』',p:'ز بهرام دارم به بخشش سپاس',k:'바흐람이 베푼 은혜에 감사드립니다.'}
    ]},
    friend: {label:'친구 · دوست', entries:[
        {id:'intro-friend-word',c:'일상 페르시아어',p:'دوست',k:'친구'},
        {id:'intro-friend-phrase',c:'『샤나메』',p:'مهربان دوست',k:'다정한 친구'},
        {id:'intro-friend-line',c:'『샤나메』',p:'به شهرم یکی مهربان دوست بود',k:'내가 사는 고장에는 다정한 친구가 있었습니다.'}
    ]}
};

const ALL_CARD_DATA=[...STORY_DATA,...Object.values(INTRO_LESSONS).flatMap(l=>l.entries)];
const fmtMs=ms=>{const sec=ms>0?Math.max(1,Math.floor(ms/1000)):0;return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;};
function b64urlDecode(value){const binary=atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0))));}
function sanitizeSnapshot(s){if(!s||s.v!==1||typeof s.id!=='string'||s.id.length>128)throw Error('지원되지 않는 공유 데이터입니다.');for(const key of ['n','g','t','c','s','d'])if(!Number.isSafeInteger(s[key])||s[key]<0||s[key]>1e8)throw Error('공유 기록이 올바르지 않습니다.');if(s.n<1||s.g>s.t||s.d<s.n||!Number.isFinite(Date.parse(s.at)))throw Error('공유 기록의 값이 잘못되었습니다.');return s;}
function cardStats(s){const ms=s.s*100;return {count:s.n,acc:s.t?Math.floor(s.g/s.t*100):100,cpm:ms>0?Math.floor(s.c/(Math.max(ms,1000)/60000)):0,ms};}

// ============================================================================
// 결과 기념 카드 V3. PC와 result.html 양쪽에 같은 함수를 유지합니다.
// 타자 점수는 노출하지 않고 입력한 표현·문학 작품·발견의 의미를 보여 줍니다.
// ============================================================================
const CARD_LITERARY = {
    greeting: {
        word:'درود', meaning:'안녕 · 인사', roman:'도루드',
        line:'درود فریدون فرخ دهم',
        translation:'복된 페레이둔의 인사를 전합니다.',
        source:'페르도우시 『샤나메』 · 페레이둔 이야기',
        page:'https://ganjoor.net/ferdousi/shahname/fereydoon/sh2/'
    },
    thanks: {
        word:'سپاس', meaning:'감사', roman:'세퍼스',
        line:'ز بهرام دارم به بخشش سپاس',
        translation:'바흐람의 은혜에 감사드립니다.',
        source:'페르도우시 『샤나메』 · 바흐람 구르 이야기',
        page:'https://ganjoor.net/ferdousi/shahname/bahgoor/sh38/'
    },
    friend: {
        word:'دوست', meaning:'친구', roman:'두스트',
        line:'به شهرم یکی مهربان دوست بود',
        translation:'내가 사는 고장에는 다정한 친구가 있었습니다.',
        source:'페르도우시 『샤나메』 · 서문',
        page:'https://ganjoor.net/ferdousi/shahname/aghaz/sh10/'
    }
};
function cardInformation(s) {
    const item = ALL_CARD_DATA.find(p => p.id === s.id);
    if (!item) throw Error('공유 데이터에 해당하는 문구가 없습니다.');
    const match = /^intro-(greeting|thanks|friend)-(word|phrase|line)$/.exec(s.id);
    if (!match) return {
        isIntro:false, written:item.p, translation:item.k,
        line:'رستم و سهراب', lineTranslation:'서로를 알아보지 못한 아버지와 아들의 비극',
        source:'페르도우시 『샤나메』 · 로스탐과 소흐랍'
    };
    const [,lesson,stage] = match;
    const literary = CARD_LITERARY[lesson];
    const romanLatin = {greeting:'dorud',thanks:'sepās',friend:'dust'}[lesson];
    return {isIntro:true,stage,written:item.p,translation:item.k,
        word:literary.word,wordMeaning:literary.meaning,roman:romanLatin+' · '+literary.roman,
        line:literary.line,lineTranslation:literary.translation,source:literary.source};
}
function drawShareCard(canvas, snapshot) {
    sanitizeSnapshot(snapshot);
    const data = cardInformation(snapshot);
    canvas.width = 1080;
    canvas.height = 1350;
    const g = canvas.getContext('2d');
    if (!g) throw Error('이미지 생성용 Canvas를 사용할 수 없습니다.');
    const navy = '#0b2a4a', blue = '#1f6794', muted = '#58728a', border = '#cfdee8';
    const faFont = '"Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif';
    const koFont = '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    const setFont = (size, bold=false, persian=false) => (bold?'bold ':'')+size+'px '+(persian?faFont:koFont);
    function getLines(text, maxWidth, font) {
        g.font = font;
        const words=String(text).trim().split(/\s+/), lines=[];
        let current='';
        for(const w of words) {
            const trial = current ? current+' '+w : w;
            if(current && g.measureText(trial).width>maxWidth){lines.push(current);current=w;}
            else current=trial;
        }
        if(current)lines.push(current);
        return lines;
    }
    function drawWrapped(text,opts={}) {
        const {x=540, y=400, width=880, maxLines=3, size=46, minSize=22,
          lineHeight=1.4, color=navy, bold=false, persian=false, align='center'}=opts;
        let sz=size, lines=[];
        for(;sz>=minSize;sz-=1){
          lines=getLines(text,width,setFont(sz,bold,persian));
          if(lines.length<=maxLines && lines.every(t=>g.measureText(t).width<=width))break;
        }
        if(lines.length>maxLines)lines=lines.slice(0,maxLines);
        g.font=setFont(sz,bold,persian);g.fillStyle=color;
        g.textAlign=align;g.direction=persian?'rtl':'ltr';
        const lh=sz*lineHeight;
        lines.forEach((line,i)=>g.fillText(line,x,y+(i-(lines.length-1)/2)*lh,width));
        g.direction='ltr';
        return sz;
    }
    // 문학 엽서: 불필요한 축하·평가 문구 없이 실제로 쓴 표현과 작품을 중심으로 배치합니다.
    g.fillStyle='#fcfbf8';g.fillRect(0,0,1080,1350);
    g.lineWidth=2;g.strokeStyle='#c9b38d';g.strokeRect(36,36,1008,1278);
    g.textAlign='center';g.fillStyle='#92764c';g.font=setFont(25,true);
    g.fillText('SHAHNAMEH',540,120);
    g.fillStyle=navy;g.font=setFont(43,true);
    g.fillText('낯선 글자, 익숙한 말',540,194);
    g.fillStyle='#b99558';g.fillRect(492,232,96,3);

    if(data.isIntro && data.stage==='word'){
        drawWrapped(data.written,{y:390,width:880,maxLines:1,size:142,minSize:80,lineHeight:1.2,color:navy,bold:true,persian:true});
        drawWrapped(data.roman,{y:490,width:860,maxLines:1,size:32,minSize:24,color:muted});
        drawWrapped(data.wordMeaning,{y:557,width:860,maxLines:1,size:43,minSize:30,color:navy,bold:true});
    }else{
        const long=Array.from(data.written).length>30;
        drawWrapped(data.written,{y:402,width:890,maxLines:3,size:long?75:94,minSize:39,lineHeight:1.36,color:navy,bold:true,persian:true});
        drawWrapped(data.translation,{y:576,width:865,maxLines:3,size:36,minSize:24,lineHeight:1.4,color:'#344c61'});
    }
    g.fillStyle='#d8ccba';g.fillRect(132,666,816,2);

    if(data.isIntro && data.stage==='line'){
        // 원문 반행을 이미 위에서 썼으므로 두 번 인쇄하지 않습니다.
        drawWrapped(data.word,{y:819,width:860,maxLines:1,size:94,minSize:55,color:navy,bold:true,persian:true});
        drawWrapped(data.roman,{y:910,width:860,maxLines:1,size:30,minSize:24,color:muted});
        drawWrapped(data.wordMeaning,{y:975,width:860,maxLines:1,size:36,minSize:24,color:'#344c61'});
    }else{
        drawWrapped(data.line,{y:825,width:890,maxLines:2,size:data.isIntro?56:72,minSize:35,lineHeight:1.42,color:'#173b4a',bold:true,persian:true});
        drawWrapped(data.lineTranslation,{y:965,width:865,maxLines:3,size:32,minSize:23,lineHeight:1.4,color:'#435d74'});
    }
    drawWrapped(data.source,{y:1085,width:910,maxLines:2,size:24,minSize:20,lineHeight:1.4,color:muted});
    g.fillStyle='#d8ccba';g.fillRect(132,1161,816,2);
    g.fillStyle=muted;g.font=setFont(22,true);g.textAlign='center';
    g.fillText('페르시아어 체험 기념',540,1214);
    g.font=setFont(21);
    g.fillText(new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Seoul'}).format(new Date(snapshot.at)),540,1257);
}

let blob=null,url=null;
function download(){if(!url)return;const a=document.createElement('a');a.href=url;a.download='나의 첫 페르시아어.png';document.body.appendChild(a);a.click();a.remove();}
async function openNative(){if(!blob)return;try{const file=new File([blob],'나의 첫 페르시아어.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'낯선 글자, 익숙한 말'});else download();}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent='공유 메뉴를 열지 못했습니다. 다운로드 버튼을 이용하세요.';}}
(async function(){try{if(!location.hash.startsWith('#share='))throw Error('결과 데이터가 없습니다. QR을 다시 스캔하세요.');const token=location.hash.slice(7);if(token.length>1800)throw Error('결과 데이터가 너무 깁니다.');const s=sanitizeSnapshot(b64urlDecode(token));if(!ALL_CARD_DATA.some(p=>p.id===s.id))throw Error('지원하지 않는 구절입니다.');const canvas=document.createElement('canvas');drawShareCard(canvas,s);blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('이미지 생성 실패');url=URL.createObjectURL(blob);document.getElementById('preview').src=url;document.getElementById('preview').style.display='block';document.getElementById('download').hidden=false;document.getElementById('download').onclick=download;document.getElementById('shareFile').onclick=openNative;const file=new File([blob],'나의 첫 페르시아어.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))document.getElementById('shareFile').style.display='block';document.getElementById('status').textContent='완성한 이미지를 휴대폰에 저장할 수 있습니다.';}catch(e){document.getElementById('status').textContent='결과 페이지 오류: '+e.message;}})();
</script></body></html>
